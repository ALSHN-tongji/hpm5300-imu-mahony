<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IMU 算法对比 · 可视化调试</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #10151f; --panel2: #0e131c; --border: #1f2937;
    --text: #d1d5db; --dim: #6b7280; --accent: #22d3ee;
    --mahony: #34d399; --madgwick: #c084fc;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header h1 span { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 11px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .param {
    display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px;
  }
  .param input[type="number"] {
    width: 62px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px; padding: 3px 5px; font-family: var(--mono);
  }
  .param.mahony { color: var(--mahony); }
  .param.madgwick { color: var(--madgwick); }
  .stat { font-family: var(--mono); font-size: 12px; color: var(--dim); display: flex; gap: 14px; }

  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .cubes { flex: 1 1 auto; min-height: 0; display: flex; }
  .cube-panel { flex: 1 1 50%; position: relative; border-right: 1px solid var(--border); min-width: 0; }
  .cube-panel:last-child { border-right: none; }
  .cube-panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cube-panel .tag {
    position: absolute; top: 8px; left: 10px; font-family: var(--mono); font-size: 12px;
    padding: 3px 8px; border-radius: 3px; background: rgba(16,21,31,.8);
  }
  .cube-panel .tag.mahony { color: var(--mahony); border: 1px solid var(--mahony); }
  .cube-panel .tag.madgwick { color: var(--madgwick); border: 1px solid var(--madgwick); }
  .cube-panel .euler { position: absolute; bottom: 8px; left: 10px; font-family: var(--mono); font-size: 11px; color: var(--dim); }

  #plot-wrap { flex: 0 0 260px; border-top: 1px solid var(--border); position: relative; }
  #metrics {
    position: absolute; top: 6px; left: 10px; z-index: 2;
    font-family: var(--mono); font-size: 12px; display: flex; gap: 20px;
    background: rgba(16,21,31,.72); padding: 3px 9px; border-radius: 3px;
  }
  #met-mahony { color: var(--mahony); }
  #met-madgwick { color: var(--madgwick); }
  #plot { position: absolute; inset: 0; width: 100%; height: 100%; }
  #plot-legend { position: absolute; top: 6px; right: 10px; font-family: var(--mono); font-size: 10px; color: var(--dim); }

  footer {
    flex: 0 0 auto; padding: 9px 14px; background: var(--panel);
    border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
  }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .foot-meta { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; }
  select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; font-size: 13px; font-family: inherit;
  }
  #drop {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; text-align: center; color: var(--dim); font-size: 14px;
    pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 5;
  }
  #drop.show { opacity: 1; pointer-events: auto; background: rgba(11,15,23,.93); }
  #drop b { color: var(--accent); }
  #drop code { font-family: var(--mono); font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>IMU 算法对比<span>Mahony vs Madgwick · 浏览器内调参</span></h1>
  <div class="spacer"></div>
  <div class="stat"><span id="stat-samples">samples: 0</span><span id="stat-fps">fps: 0</span></div>
  <div class="param mahony">Mahony Kp<input type="number" id="p-kp" value="2" step="0.1" />Ki<input type="number" id="p-ki" value="0.1" step="0.01" /><label style="margin-left:4px"><input type="checkbox" id="p-adaptive" checked style="vertical-align:middle" />自适应</label></div>
  <div class="param madgwick">Madgwick β<input type="number" id="p-beta" value="0.05" step="0.01" /></div>
  <button class="btn" id="btn-load">加载 CSV</button>
  <input type="file" id="file" accept=".csv,.txt" style="display:none" />
</header>

<main>
  <div class="cubes">
    <div class="cube-panel">
      <canvas id="cube-mahony"></canvas>
      <div class="tag mahony">MAHONY</div>
      <div class="euler" id="eul-mahony">R=+0.0 P=+0.0 Y=+0.0</div>
    </div>
    <div class="cube-panel">
      <canvas id="cube-madgwick"></canvas>
      <div class="tag madgwick">MADGWICK</div>
      <div class="euler" id="eul-madgwick">R=+0.0 P=+0.0 Y=+0.0</div>
    </div>
  </div>
  <div id="plot-wrap">
    <canvas id="plot"></canvas>
    <div id="metrics">
      <span id="met-mahony">Mahony：漂移 --°/min｜噪声 --°</span>
      <span id="met-madgwick">Madgwick：漂移 --°/min｜噪声 --°</span>
    </div>
    <div id="plot-legend">— Mahony  ·· Madgwick | 红=Roll 绿=Pitch 蓝=Yaw</div>
  </div>
  <div id="drop">
    <div>把 <b>MODE 6 原始数据</b>（7 列）拖到这里，或点右上角「加载 CSV」</div>
    <code>格式：tick,ax,ay,az,gx,gy,gz</code>
  </div>
</main>

<footer>
  <button class="btn primary" id="btn-play">▶ 播放</button>
  <button class="btn" id="btn-reset">⏮ 复位</button>
  <select id="speed">
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
  </select>
  <input type="range" id="scrub" min="0" max="0" value="0" step="1" />
  <label><input type="checkbox" id="loop" checked style="vertical-align:middle" /> 循环</label>
  <span class="foot-meta" id="foot-time">0 / 0</span>
</footer>

<script>
const DEG2RAD = Math.PI / 180, RAD2DEG = 180 / Math.PI;

/* ══════════ 数学工具 ══════════ */
function quatToMat(w, x, y, z) {
  const n = Math.hypot(w, x, y, z) || 1;
  w /= n; x /= n; y /= n; z /= n;
  const xx = x*x, yy = y*y, zz = z*z, xy = x*y, xz = x*z, yz = y*z, wx = w*x, wy = w*y, wz = w*z;
  return [1-2*(yy+zz), 2*(xy-wz), 2*(xz+wy), 2*(xy+wz), 1-2*(xx+zz), 2*(yz-wx), 2*(xz-wy), 2*(yz+wx), 1-2*(xx+yy)];
}
function rot(m, p) { return [m[0]*p[0]+m[1]*p[1]+m[2]*p[2], m[3]*p[0]+m[4]*p[1]+m[5]*p[2], m[6]*p[0]+m[7]*p[1]+m[8]*p[2]]; }
function q2euler(w,x,y,z) {
  const r = Math.atan2(2*(w*x+y*z), 1-2*(x*x+y*y));
  const p = Math.asin(Math.max(-1, Math.min(1, 2*(w*y-z*x))));
  const yw = Math.atan2(2*(w*z+x*y), 1-2*(y*y+z*z));
  return [r*RAD2DEG, p*RAD2DEG, yw*RAD2DEG];
}

/* ══════════ Mahony 互补滤波（与 mahony.c 逐行对应）══════════
 * gx/gy/gz 传进来已经是 rad/s；ax/ay/az 未归一化(g) */
function makeMahony(kpNominal, ki, adaptiveKp) {
  const f = { q0:1,q1:0,q2:0,q3:0, ix:0,iy:0,iz:0, init:false, confSm:1.0,
              kpNominal, ki, adaptiveKp, kpThresh:0.3, kpMin:0.1, tc:0.15 };
  f.initFromAccel = function(ax,ay,az) {
    let n = 1/Math.hypot(ax,ay,az); ax*=n; ay*=n; az*=n;
    const roll = Math.atan2(ay, az), pitch = Math.atan2(-ax, Math.hypot(ay, az));
    const cr=Math.cos(roll*.5), sr=Math.sin(roll*.5), cp=Math.cos(pitch*.5), sp=Math.sin(pitch*.5);
    this.q0=cr*cp; this.q1=sr*cp; this.q2=cr*sp; this.q3=0; this.init=true;
  };
  f.update = function(gx,gy,gz,ax,ay,az,dt) {
    if (!this.init) { this.initFromAccel(ax,ay,az); return; }
    const a_norm = Math.hypot(ax,ay,az);
    let rn = 1/a_norm; ax*=rn; ay*=rn; az*=rn;
    // 自适应 Kp：|a| 偏离 1g 时降低信任
    const dev = Math.abs(a_norm - 1.0);
    let conf = 1.0 - dev/this.kpThresh;
    if (conf < this.kpMin) conf = this.kpMin;
    if (conf > 1.0) conf = 1.0;
    let Kp;
    if (this.adaptiveKp) {
      const alpha = dt/(this.tc + dt);
      this.confSm += alpha*(conf - this.confSm);
      Kp = this.kpNominal * this.confSm;
    } else {
      Kp = this.kpNominal * conf;
    }
    // full-v 重力估计 + 叉积误差
    const vx = 2*(this.q1*this.q3 - this.q0*this.q2);
    const vy = 2*(this.q0*this.q1 + this.q2*this.q3);
    const vz = this.q0*this.q0 - this.q1*this.q1 - this.q2*this.q2 + this.q3*this.q3;
    const ex = ay*vz - az*vy, ey = az*vx - ax*vz, ez = ax*vy - ay*vx;
    if (this.ki > 0) {
      this.ix += this.ki*ex*dt; this.iy += this.ki*ey*dt; this.iz += this.ki*ez*dt;
      this.ix = Math.max(-20, Math.min(20, this.ix));
      this.iy = Math.max(-20, Math.min(20, this.iy));
      this.iz = Math.max(-20, Math.min(20, this.iz));
    }
    gx = gx + Kp*ex + this.ix;
    gy = gy + Kp*ey + this.iy;
    gz = gz + Kp*ez + this.iz;
    const hw = 0.5*(-this.q1*gx - this.q2*gy - this.q3*gz);
    const hx = 0.5*( this.q0*gx + this.q2*gz - this.q3*gy);
    const hy = 0.5*( this.q0*gy - this.q1*gz + this.q3*gx);
    const hz = 0.5*( this.q0*gz + this.q1*gy - this.q2*gx);
    this.q0 += hw*dt; this.q1 += hx*dt; this.q2 += hy*dt; this.q3 += hz*dt;
    rn = 1/Math.hypot(this.q0,this.q1,this.q2,this.q3);
    this.q0*=rn; this.q1*=rn; this.q2*=rn; this.q3*=rn;
    if (this.q0 < 0) { this.q0=-this.q0; this.q1=-this.q1; this.q2=-this.q2; this.q3=-this.q3; }
  };
  return f;
}

/* ══════════ Madgwick 梯度下降（与 madgwick.c 逐行对应）══════════
 * gx/gy/gz 传进来已经是 rad/s */
function makeMadgwick(beta) {
  const f = { q0:1,q1:0,q2:0,q3:0, beta, init:false };
  f.initFromAccel = function(ax,ay,az) {
    let n = 1/Math.hypot(ax,ay,az); ax*=n; ay*=n; az*=n;
    const roll = Math.atan2(ay, az), pitch = Math.atan2(-ax, Math.hypot(ay, az));
    const cr=Math.cos(roll*.5), sr=Math.sin(roll*.5), cp=Math.cos(pitch*.5), sp=Math.sin(pitch*.5);
    this.q0=cr*cp; this.q1=sr*cp; this.q2=cr*sp; this.q3=0; this.init=true;
  };
  f.update = function(gx,gy,gz,ax,ay,az,dt) {
    if (!this.init) { this.initFromAccel(ax,ay,az); return; }
    let rn = 1/Math.hypot(ax,ay,az); ax*=rn; ay*=rn; az*=rn;
    const q0=this.q0, q1=this.q1, q2=this.q2, q3=this.q3;
    const f1 = 2*(q1*q3 - q0*q2) - ax;
    const f2 = 2*(q0*q1 + q2*q3) - ay;
    const f3 = (q0*q0 - q1*q1 - q2*q2 + q3*q3) - az;
    let g0 = -2*q2*f1 + 2*q1*f2 + 2*q0*f3;
    let g1 =  2*q3*f1 + 2*q0*f2 - 2*q1*f3;
    let g2 = -2*q0*f1 + 2*q3*f2 - 2*q2*f3;
    let g3 =  2*q1*f1 + 2*q2*f2;
    rn = 1/Math.hypot(g0,g1,g2,g3); g0*=rn; g1*=rn; g2*=rn; g3*=rn;
    const wq0 = 0.5*(-q1*gx - q2*gy - q3*gz);
    const wq1 = 0.5*( q0*gx + q2*gz - q3*gy);
    const wq2 = 0.5*( q0*gy - q1*gz + q3*gx);
    const wq3 = 0.5*( q0*gz + q1*gy - q2*gx);
    this.q0 += (wq0 - this.beta*g0)*dt;
    this.q1 += (wq1 - this.beta*g1)*dt;
    this.q2 += (wq2 - this.beta*g2)*dt;
    this.q3 += (wq3 - this.beta*g3)*dt;
    rn = 1/Math.hypot(this.q0,this.q1,this.q2,this.q3);
    this.q0*=rn; this.q1*=rn; this.q2*=rn; this.q3*=rn;
    if (this.q0 < 0) { this.q0=-this.q0; this.q1=-this.q1; this.q2=-this.q2; this.q3=-this.q3; }
  };
  return f;
}

/* ══════════ 立方体渲染（复用之前的逻辑）══════════ */
const HS = 0.6, CAM_D = 7;
const VERTS = [[-HS,-HS,-HS],[HS,-HS,-HS],[HS,HS,-HS],[-HS,HS,-HS],[-HS,-HS,HS],[HS,-HS,HS],[HS,HS,HS],[-HS,HS,HS]];
const FACES = [
  {i:[4,5,6,7],c:'#334ce6'},{i:[0,1,2,3],c:'#26388f'},{i:[1,5,6,2],c:'#e63333'},
  {i:[0,4,7,3],c:'#b32626'},{i:[3,2,6,7],c:'#33cc33'},{i:[0,1,5,4],c:'#269926'},
];
function proj(p, cx, cy, s) { const t = CAM_D/(CAM_D-p[2]); return [cx+p[0]*t*s, cy-p[1]*t*s]; }
function drawArrow(c, p0, p1, col) {
  c.strokeStyle=col; c.lineWidth=2.5; c.beginPath(); c.moveTo(p0[0],p0[1]); c.lineTo(p1[0],p1[1]); c.stroke();
  const dx=p1[0]-p0[0], dy=p1[1]-p0[1], len=Math.hypot(dx,dy); if(len<1)return;
  const ux=dx/len,uy=dy/len,ah=9;
  c.beginPath(); c.moveTo(p1[0],p1[1]); c.lineTo(p1[0]-ux*ah-uy*ah*.5,p1[1]-uy*ah+ux*ah*.5);
  c.lineTo(p1[0]-ux*ah+uy*ah*.5,p1[1]-uy*ah-ux*ah*.5); c.closePath(); c.fillStyle=col; c.fill();
}
function renderCube(c, w, h, qw, qx, qy, qz) {
  const dpr = window.devicePixelRatio||1;
  if (c.width !== w*dpr || c.height !== h*dpr) { c.width=w*dpr; c.height=h*dpr; }
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h); g.fillStyle='#0b0f17'; g.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2, s=Math.min(w,h)/5;
  const m = quatToMat(qw,qx,qy,qz);
  const P = VERTS.map(v => proj(rot(m,v), cx, cy, s));
  const faces = FACES.map(f => {
    const pts = f.i.map(k => P[k]);
    const dz = f.i.reduce((a,k)=>a+rot(m,VERTS[k])[2],0)/4;
    return {f, pts, dz};
  }).sort((a,b)=>a.dz-b.dz);
  for (const o of faces) {
    g.beginPath(); g.moveTo(o.pts[0][0],o.pts[0][1]);
    for(let i=1;i<4;i++) g.lineTo(o.pts[i][0],o.pts[i][1]);
    g.closePath(); g.fillStyle=o.f.c; g.fill(); g.strokeStyle='rgba(8,8,10,.65)'; g.lineWidth=1; g.stroke();
  }
  const o0 = proj(rot(m,[0,0,0]),cx,cy,s);
  drawArrow(g, o0, proj(rot(m,[2,0,0]),cx,cy,s), '#ff5555');
  drawArrow(g, o0, proj(rot(m,[0,2,0]),cx,cy,s), '#55ff55');
  drawArrow(g, o0, proj(rot(m,[0,0,2]),cx,cy,s), '#5599ff');
}

/* ══════════ 状态 ══════════ */
const S = { raw:null, dt:0.001, N:0, mah:null, mad:null, idx:0, playing:false, speed:1, loop:true, idleT:0 };
let plotData = null; // {m:[], d:[]} 降采样后的欧拉角（用于曲线）

/* ══════════ 解析 MODE 6（7 列）══════════ */
function parseRaw(text) {
  const ticks=[], acc=[], gyr=[];
  for (const raw of text.split(/\r?\n/)) {
    const line=raw.trim(); if(!line||line.startsWith('#')) continue;
    const p=line.split(','); if(p.length<7) continue;
    const n=p.slice(0,7).map(Number); if(n.some(isNaN)) continue;
    ticks.push(n[0]); acc.push([n[1],n[2],n[3]]); gyr.push([n[4],n[5],n[6]]);
  }
  return {ticks, acc, gyr};
}

/* ══════════ 预计算：跑两个滤波器，产出四元数轨迹 ══════════ */
function precompute() {
  const r = S.raw; if (!r) return;
  const N = r.acc.length;
  const mah = makeMahony(parseFloat(document.getElementById('p-kp').value), parseFloat(document.getElementById('p-ki').value), document.getElementById('p-adaptive').checked);
  const mad = makeMadgwick(parseFloat(document.getElementById('p-beta').value));
  S.mah = new Float32Array(4*N); S.mad = new Float32Array(4*N);
  // 用 tick 中位数算 dt
  let dt = 1/1000;
  if (N > 1) {
    const d=[]; for(let i=1;i<N;i++) d.push(r.ticks[i]-r.ticks[i-1]);
    d.sort((a,b)=>a-b); dt = Math.max(1e-6, (d[Math.floor(d.length/2)]||1000)/24e6);
  }
  S.dt = dt;
  for (let i=0;i<N;i++) {
    const [ax,ay,az]=r.acc[i], gx=r.gyr[i][0]*DEG2RAD, gy=r.gyr[i][1]*DEG2RAD, gz=r.gyr[i][2]*DEG2RAD;
    mah.update(gx,gy,gz,ax,ay,az,dt); mad.update(gx,gy,gz,ax,ay,az,dt);
    const b=i*4; S.mah[b]=mah.q0;S.mah[b+1]=mah.q1;S.mah[b+2]=mah.q2;S.mah[b+3]=mah.q3;
    S.mad[b]=mad.q0;S.mad[b+1]=mad.q1;S.mad[b+2]=mad.q2;S.mad[b+3]=mad.q3;
  }
  // 降采样到 ≤6000 点用于画曲线
  const step = Math.max(1, Math.ceil(N/6000));
  const pm=[], pd=[];
  for (let i=0;i<N;i+=step) {
    const b=i*4;
    pm.push(q2euler(S.mah[b],S.mah[b+1],S.mah[b+2],S.mah[b+3]));
    pd.push(q2euler(S.mad[b],S.mad[b+1],S.mad[b+2],S.mad[b+3]));
  }
  plotData = { m:pm, d:pd };
  S.N = N; S.idx = 0;
  document.getElementById('stat-samples').textContent = 'samples: ' + N + ' @ ' + Math.round(1/dt) + 'Hz';
  document.getElementById('scrub').max = N-1;
  computeMetrics();
  applyFrame(0);
}

/* 量化指标：漂移速率（°/min）与稳态噪声 RMS（°），调参时看数字即可 */
function computeMetrics() {
  const N = S.N;
  if (!N || !S.mah || !S.mad) return;
  const start = Math.floor(N * 0.05);          // 跳过前 5% 收敛瞬态
  const durSec = (N - 1 - start) * S.dt;        // 稳态段时间
  const metric = (quat) => {
    const yawAt = i => { const b=i*4; return q2euler(quat[b],quat[b+1],quat[b+2],quat[b+3])[2]; };
    const drift = (yawAt(N-1) - yawAt(start)) / durSec * 60;  // °/min
    let sum=0, sum2=0, cnt=0;
    for (let i=start; i<N; i++) {
      const b=i*4;
      const e = q2euler(quat[b],quat[b+1],quat[b+2],quat[b+3]);
      for (let k=0;k<3;k++) { const v=e[k]; sum+=v; sum2+=v*v; cnt++; }
    }
    const mean = sum/cnt;
    const noise = Math.sqrt(Math.max(0, sum2/cnt - mean*mean));  // RMS
    return { drift, noise };
  };
  const mm = metric(S.mah), md = metric(S.mad);
  document.getElementById('met-mahony').textContent = `Mahony：漂移 ${mm.drift.toFixed(2)}°/min｜噪声 ${mm.noise.toFixed(3)}°`;
  document.getElementById('met-madgwick').textContent = `Madgwick：漂移 ${md.drift.toFixed(2)}°/min｜噪声 ${md.noise.toFixed(3)}°`;
}

function loadRaw(text) {
  const r = parseRaw(text);
  if (!r.acc.length) { alert('没解析到有效数据。请确认是 MODE 6 的 7 列输出。'); return; }
  S.raw = r;
  document.getElementById('drop').classList.remove('show');
  precompute();
}

/* ══════════ 应用一帧 ══════════ */
function applyFrame(i) {
  const b=i*4;
  const mh=q2euler(S.mah[b],S.mah[b+1],S.mah[b+2],S.mah[b+3]);
  const md=q2euler(S.mad[b],S.mad[b+1],S.mad[b+2],S.mad[b+3]);
  const f=o=>((o>=0?'+':'')+o.toFixed(1));
  document.getElementById('eul-mahony').textContent = `R=${f(mh[0])} P=${f(mh[1])} Y=${f(mh[2])}`;
  document.getElementById('eul-madgwick').textContent = `R=${f(md[0])} P=${f(md[1])} Y=${f(md[2])}`;
  document.getElementById('scrub').value = i;
  document.getElementById('foot-time').textContent = `${i} / ${S.N-1}`;
}

/* ══════════ 漂移曲线 ══════════ */
function renderPlot() {
  const c = document.getElementById('plot');
  const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio||1;
  if (c.width !== w*dpr || c.height !== h*dpr) { c.width=w*dpr; c.height=h*dpr; }
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h); g.fillStyle='#0e131c'; g.fillRect(0,0,w,h);
  if (!plotData) return;
  const padL=40, padR=12, padT=10, padB=18;
  const cw=w-padL-padR, ch=h-padT-padB;
  // 找 y 范围
  let mn=Infinity, mx=-Infinity;
  for (const a of [plotData.m, plotData.d]) for (const e of a) for (const v of e) { if(v<mn)mn=v; if(v>mx)mx=v; }
  if (!isFinite(mn) || !isFinite(mx)) { mn=-180; mx=180; }
  else {
    const pad = Math.max((mx-mn)*0.1, 0.5);  // 自动缩放 + 10% 边距（至少 ±0.5°）
    mn -= pad; mx += pad;
  }
  const lo = mn, hi = mx;
  const X = i => padL + cw*i/Math.max(1, plotData.m.length-1);
  const Y = v => padT + ch*(hi-v)/(hi-lo);
  // 网格 + 刻度
  g.strokeStyle='#1f2937'; g.lineWidth=0.5; g.fillStyle='#6b7280'; g.font='10px monospace';
  for (let t=Math.ceil(lo/60)*60; t<=hi; t+=60) {
    g.beginPath(); g.moveTo(padL,Y(t)); g.lineTo(w-padR,Y(t)); g.stroke();
    g.fillText(t+'°', 4, Y(t)+3);
  }
  // 三条轴，Mahony 实线，Madgwick 虚线
  const axes=[[0,'#f87171','#fca5a5'],[1,'#4ade80','#86efac'],[2,'#60a5fa','#93c5fd']];
  const drawLine = (arr, idx, color, dash) => {
    g.strokeStyle=color; g.lineWidth=1.2; g.setLineDash(dash?[4,3]:[]);
    g.beginPath();
    for (let i=0;i<arr.length;i++) { const x=X(i), y=Y(arr[i][idx]); i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  };
  for (const [idx, cm, cd] of axes) {
    drawLine(plotData.m, idx, cm, false);
    drawLine(plotData.d, idx, cd, true);
  }
  g.setLineDash([]);
  // 播放游标
  if (S.N) {
    const cx = padL + cw*(S.idx/(S.N-1));
    g.strokeStyle='#22d3ee'; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx,padT); g.lineTo(cx,padT+ch); g.stroke();
  }
}

/* ══════════ 主循环 ══════════ */
const BASE_FPS = null; // 播放按采样率走，dt 从数据得到
let last = performance.now(), fpsAcc=0, fpsN=0, fpsLast=last;
function loop(now) {
  const dts = Math.min((now-last)/1000, 0.1); last=now;
  if (S.N) {
    if (S.playing) {
      S.idx += (1/S.dt) * S.speed * dts;
      if (S.idx >= S.N) {
        if (S.loop) S.idx = 0;
        else { S.idx=S.N-1; S.playing=false; document.getElementById('btn-play').textContent='▶ 播放'; }
      }
      applyFrame(Math.floor(S.idx));
    }
  }
  const b = Math.floor(S.idx)*4;
  const wm=document.getElementById('cube-mahony').clientWidth, hm=document.getElementById('cube-mahony').clientHeight;
  const wd=document.getElementById('cube-madgwick').clientWidth, hd=document.getElementById('cube-madgwick').clientHeight;
  if (S.N) {
    renderCube(document.getElementById('cube-mahony'), wm, hm, S.mah[b],S.mah[b+1],S.mah[b+2],S.mah[b+3]);
    renderCube(document.getElementById('cube-madgwick'), wd, hd, S.mad[b],S.mad[b+1],S.mad[b+2],S.mad[b+3]);
  } else {
    // 无数据：待机自转动画（两个立方体一起转）
    S.idleT += dts;
    const a = S.idleT * 0.5, wob = Math.sin(S.idleT * 0.4) * 0.26;
    const cw = Math.cos(a), sw = Math.sin(a), cp = Math.cos(wob), sp = Math.sin(wob);
    renderCube(document.getElementById('cube-mahony'), wm, hm, cw*cp, 0, sw*cp, cw*sp);
    renderCube(document.getElementById('cube-madgwick'), wd, hd, cw*cp, 0, sw*cp, cw*sp);
  }
  renderPlot();
  fpsN++; if(now-fpsLast>=500){ fpsAcc=fpsN*1000/(now-fpsLast); document.getElementById('stat-fps').textContent='fps: '+Math.round(fpsAcc); fpsN=0; fpsLast=now; }
  requestAnimationFrame(loop);
}

/* ══════════ 文件加载 ══════════ */
const btnLoad=document.getElementById('btn-load'), fileInput=document.getElementById('file');
btnLoad.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>loadRaw(r.result); r.readAsText(f); });
const drop=document.getElementById('drop'); let dragDepth=0;
document.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;drop.classList.add('show');});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('dragleave',e=>{dragDepth--;if(dragDepth<=0){dragDepth=0;drop.classList.remove('show');}});
document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;drop.classList.remove('show');const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadRaw(r.result);r.readAsText(f);});

/* ══════════ 控制 ══════════ */
document.getElementById('btn-play').addEventListener('click',()=>{ if(!S.N)return; S.playing=!S.playing; document.getElementById('btn-play').textContent=S.playing?'⏸ 暂停':'▶ 播放'; });
document.getElementById('btn-reset').addEventListener('click',()=>{ S.idx=0; if(S.N)applyFrame(0); });
document.getElementById('speed').addEventListener('change',e=>S.speed=parseFloat(e.target.value));
document.getElementById('loop').addEventListener('change',e=>S.loop=e.target.checked);
document.getElementById('scrub').addEventListener('input',e=>{ S.idx=parseInt(e.target.value,10); if(S.N)applyFrame(S.idx); });
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();document.getElementById('btn-play').click();} else if(e.code==='KeyR')document.getElementById('btn-reset').click(); });

/* 调参 → 自动重新预计算（防抖）*/
let recalcTimer=null;
for (const id of ['p-kp','p-ki','p-beta','p-adaptive']) {
  document.getElementById(id).addEventListener('input', () => {
    clearTimeout(recalcTimer);
    recalcTimer = setTimeout(() => { if (S.raw) precompute(); }, 300);
  });
}

requestAnimationFrame(loop);
</script>
</body>
</html>
